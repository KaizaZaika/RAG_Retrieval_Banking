[project]
name = "auth-backend"
version = "0.1.0"
description = "First iteration of authentication backend using Clean Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pwdlib[argon2]>=0.2.0",
    "PyJWT>=2.8.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]
